# ==============================================================================
# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# Proyecto Final Integrador · Secure CRM — Equipo Azul (Hito 3)
# ==============================================================================
# Este archivo se carga en ModSecurity ANTES del OWASP CRS (reglas 911–949).
# Todas las reglas aquí están ACTIVAS (sin comentar) y diseñadas con mínimo
# privilegio para que:
#   1. El tráfico legítimo de la aplicación no sufra falsos positivos en modo On.
#   2. Todos los PoCs del Red Team (PoC-01 SQLi -> 942100, PoC-02 XSS -> 941100,
#      PoC-03 DELETE -> 911100) se sigan detectando en el Dashboard de Kibana
#      (DET-01, DET-02 y DET-03) y bloqueando con 403 en modo On.
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. EXCLUSIÓN ACTIVA TIPO 1 (id:10001) · Regla CRS 920350 (Host IP numérica)
# ------------------------------------------------------------------------------
# Quita ÚNICAMENTE el header REQUEST_HEADERS:Host de la regla 920350 cuando el
# cliente local invoca http://127.0.0.1:8080.
# ------------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^127\.0\.0\.1(?::\d+)?$" \
    "id:10001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=920350;REQUEST_HEADERS:Host"


# ------------------------------------------------------------------------------
# 2. EXCLUSIÓN ACTIVA TIPO 1 (id:10010) · Regla CRS 942100 en /api/tickets
# ------------------------------------------------------------------------------
# Quita ÚNICAMENTE el campo de texto libre ARGS:json.description de la regla
# 942100 (SQLi) en la ruta /api/tickets para permitir crear/editar tickets con
# descripciones técnicas que incluyan comillas o fragmentos como '1'='1'.
# • No afecta a DET-01 SQLi (PoC-01 en /api/auth/login y ?q= siguen disparando
#   942100) ni a DET-02 XSS (941100 sigue activo sobre ARGS:json.description).
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/tickets" \
    "id:10010,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.description"


# ------------------------------------------------------------------------------
# 3. EXCLUSIÓN ACTIVA TIPO 2 (id:10011) · Regla CRS 911100 en PUT legítimos
# ------------------------------------------------------------------------------
# Cuando el usuario edita un ticket (PUT /api/tickets/:id) o cambia un rol
# (PUT /api/users/:id/role) desde la web, el método PUT disparaba el falso
# positivo 911100 ("Method is not allowed by policy").
# • Esta regla Tipo 2 (ctl:ruleRemoveById=911100) permite PUT únicamente en
#   esas dos rutas legítimas, mientras que las peticiones DELETE del PoC-03
#   siguen disparando la regla 911100 para que se vean siempre en el Dashboard
#   de Kibana bajo DET-03 Metodo (o se ajustan globalmente como Tipo 4 con
#   ALLOWED_METHODS en waf-siem/.env).
# ------------------------------------------------------------------------------
SecRule REQUEST_METHOD "@streq PUT" \
    "id:10011,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@rx ^/api/(?:tickets/\d+|users/\d+/role)$" \
        "ctl:ruleRemoveById=911100"
