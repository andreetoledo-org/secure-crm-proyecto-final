# ==============================================================================
# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# Proyecto Final Integrador · Secure CRM — Equipo Azul (Hito 3)
# ==============================================================================
# Este archivo se carga en ModSecurity ANTES de las reglas del OWASP CRS
# (reglas 911 a 949) para aplicar exclusiones quirúrgicas (ctl:...) en fase 1
# bajo el principio de mínimo privilegio:
#   - Nunca se excluye la regla de evaluación de umbral 949110.
#   - Nunca se apaga el CRS completo ni familias enteras (941*, 942*).
#   - Rango de IDs reservados para reglas locales del Equipo Azul: 10000–10999.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. EXCLUSIÓN ACTIVA TIPO 1 (id:10001) · Regla CRS 920350 (Host IP numérica)
# ------------------------------------------------------------------------------
# • Falso positivo observado: En pruebas locales cuando un cliente o script
#   invoca http://127.0.0.1:8080, la regla 920350 ("Host header is a numeric
#   IP address") marca REQUEST_HEADERS:Host.
# • Qué se excluye (Tipo 1 - un campo, una regla, una condición):
#   Se excluye ÚNICAMENTE el header REQUEST_HEADERS:Host de la regla 920350
#   y SOLO cuando su valor coincide con la IP de loopback 127.0.0.1.
# • Riesgo aceptado: Las peticiones con Host 127.0.0.1 no suman puntos por la
#   regla 920350; cualquier otra IP en Host y todas las demás reglas del CRS
#   (941* XSS, 942* SQLi, 911100 métodos, etc.) siguen activas.
# ------------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^127\.0\.0\.1(?::\d+)?$" \
    "id:10001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=920350;REQUEST_HEADERS:Host"


# ------------------------------------------------------------------------------
# 2. REGISTRO DE AJUSTE TIPO 4 · Regla CRS 911100 (Métodos PUT y DELETE)
# ------------------------------------------------------------------------------
# • Falso positivo observado en modo On (2026-11-19 20:16–20:27):
#   Al editar un ticket (PUT /api/tickets/:id) o eliminar un ticket
#   (DELETE /api/tickets/:id) desde la interfaz web legítima (:3000 -> :8080),
#   el WAF devolvía HTTP 403 disparando la regla 911100 ("Method is not
#   allowed by policy", score 5 -> bloqueo en 949110), ya que el CRS por
#   defecto solo permite GET, HEAD, POST y OPTIONS.
# • Cómo se resolvió (Exclusión Tipo 4 en waf-siem/.env):
#   Como lo que coincide en la regla 911100 es el verbo REQUEST_METHOD y no un
#   parámetro ARGS, según la arquitectura del OWASP CRS se configuró en .env:
#       ALLOWED_METHODS=GET HEAD POST OPTIONS PUT DELETE
#   (que actualiza la variable tx.allowed_methods en crs-setup.conf).
# • Muestra equivalente como SecRule acotada por ruta (Tipo 2, comentada para
#   que cuando no se active ALLOWED_METHODS la regla 911100 se siga viendo en
#   el Dashboard de Kibana bajo DET-03 Metodo):
#
# SecRule REQUEST_URI "@rx ^/api/(?:tickets/\d+|users/\d+/role)$" \
#     "id:10011,phase:1,pass,nolog,\
#     ctl:ruleRemoveById=911100"
# ------------------------------------------------------------------------------


# ------------------------------------------------------------------------------
# 3. MUESTRA DE EXCLUSIÓN TIPO 1 (id:10010, comentada / desactivada)
#    Regla CRS 942100 en campo ARGS:json.description sobre /api/tickets
# ------------------------------------------------------------------------------
# • Propósito de esta muestra: Si un ticket legítimo en POST/PUT /api/tickets
#   incluye expresiones técnicas como '1'='1' en el campo JSON "description",
#   esta regla Tipo 1 quita SOLO ARGS:json.description de la regla 942100 y
#   SOLO en /api/tickets (manteniendo activa la protección 941* contra XSS en
#   ese mismo campo y 942100 contra SQLi en /api/auth/login y ?q=).
# • Se mantiene comentada/desactivada para que los eventos de prueba de la
#   regla 942100 se registren y visualicen en el Dashboard de Kibana (DET-01):
#
# SecRule REQUEST_URI "@beginsWith /api/tickets" \
#     "id:10010,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetById=942100;ARGS:json.description"
# ------------------------------------------------------------------------------
