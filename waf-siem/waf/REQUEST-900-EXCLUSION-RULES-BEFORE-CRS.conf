# ==============================================================================
# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# Proyecto Final Integrador · Secure CRM — Equipo Azul (Hito 3)
# ==============================================================================
# Este archivo se carga en ModSecurity ANTES del OWASP CRS (reglas 911–949).
# Aquí se configuran las exclusiones en tiempo de ejecución (phase:1 / phase:2)
# aplicando el principio de mínimo privilegio:
#   - NUNCA se excluye la regla de umbral de bloqueo 949110.
#   - NUNCA se desactiva el CRS completo ni una familia entera (941*, 942*).
#   - Rango de IDs propios del Equipo Azul: 10000–10999.
#
# Resumen de dónde vive cada uno de los 4 Tipos de Exclusión en nuestro WAF:
#   • Tipo 1 (Un campo, una regla, una ruta)   -> En este archivo (id:10001, id:10010)
#   • Tipo 2 (Una regla entera en una ruta)    -> En este archivo (id:10011)
#   • Tipo 3 (Un campo en todas las rutas)     -> En RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
#   • Tipo 4 (Métodos HTTP PUT/DELETE 911100)  -> En waf-siem/.env (ALLOWED_METHODS)
# ==============================================================================


# ------------------------------------------------------------------------------
# TIPO 1 (ACTIVA · id:10001) · Un header/campo, una regla (920350), una condición
# ------------------------------------------------------------------------------
# • Caso en Secure CRM: Peticiones locales hacia http://127.0.0.1:8080 disparan
#   la regla 920350 ("Host header is a numeric IP address").
# • Acción quirúrgica: ctl:ruleRemoveTargetById quita ÚNICAMENTE el header
#   REQUEST_HEADERS:Host de la regla 920350 cuando el Host es 127.0.0.1.
# ------------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^127\.0\.0\.1(?::\d+)?$" \
    "id:10001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=920350;REQUEST_HEADERS:Host"


# ------------------------------------------------------------------------------
# TIPO 1 (MUESTRA PARA DEMO · id:10010) · Un campo, una regla (942100), una ruta
# ------------------------------------------------------------------------------
# • Caso en Secure CRM: Un agente de soporte crea o edita un ticket en
#   /api/tickets cuyo campo de texto libre "description" (ARGS:json.description)
#   incluye fragmentos técnicos como '1'='1' o palabras SQL que disparan 942100.
# • Acción quirúrgica: ctl:ruleRemoveTargetById=942100;ARGS:json.description
#   quita SOLO ese campo de SOLO la regla 942100 y SOLO en /api/tickets.
#   (Si un atacante envía XSS en description sigue bloqueado por 941100, y si
#   envía SQLi en /api/auth/login o en ?q= sigue bloqueado por 942100).
# •Nota: Se deja comentada para que los eventos de prueba de 942100 se vean en
#   el Dashboard de Kibana (DET-01); descomentar para activar la exclusión:
# ------------------------------------------------------------------------------
# SecRule REQUEST_URI "@beginsWith /api/tickets" \
#     "id:10010,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetById=942100;ARGS:json.description"


# ------------------------------------------------------------------------------
# TIPO 2 (MUESTRA PARA DEMO · id:10011) · Una regla entera en una ruta exacta
# ------------------------------------------------------------------------------
# • Caso en Secure CRM: Cuando no hay un parámetro ARGS:campo que aislar porque
#   la regla evalúa el método o protocolo de la petición en una ruta específica,
#   como permitir la edición/eliminación en /api/tickets/:id o cambio de rol en
#   /api/users/:id/role sin que la regla 911100 sume puntos en esas dos rutas.
# • Acción quirúrgica: ctl:ruleRemoveById=911100 acotada exclusivamente al
#   patrón de ruta @rx ^/api/(?:tickets/\d+|users/\d+/role)$.
# • Nota: Se deja comentada para que la regla 911100 se visualice en el
#   Dashboard de Kibana (DET-03 Metodo) durante las pruebas sin exclusión:
# ------------------------------------------------------------------------------
# SecRule REQUEST_URI "@rx ^/api/(?:tickets/\d+|users/\d+/role)$" \
#     "id:10011,phase:1,pass,nolog,\
#     ctl:ruleRemoveById=911100"


# ------------------------------------------------------------------------------
# TIPO 4 (CONFIGURACIÓN CRS EN waf-siem/.env) · Métodos HTTP de la API REST
# ------------------------------------------------------------------------------
# • Caso real aplicado en Hito 3 (2026-11-19 20:27):
#   Para habilitar los métodos legítimos PUT y DELETE de la API REST frente a la
#   regla 911100 ("Method is not allowed by policy"), en OWASP CRS se ajusta la
#   variable de entorno en waf-siem/.env:
#       ALLOWED_METHODS=GET HEAD POST OPTIONS PUT DELETE
#   (manteniendo bloqueados por 911100 métodos no usados como PATCH o TRACE).
# ------------------------------------------------------------------------------
