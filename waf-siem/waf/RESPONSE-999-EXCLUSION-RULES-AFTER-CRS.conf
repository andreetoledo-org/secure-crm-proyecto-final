# ==============================================================================
# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
# Proyecto Final Integrador · Secure CRM — Equipo Azul (Hito 3)
# ==============================================================================
# Este archivo se carga en ModSecurity DESPUÉS de que ya se cargaron todas las
# reglas del OWASP CRS (911–949).
# Aquí se aplican las exclusiones de TIPO 3 (en tiempo de configuración,
# usando SecRuleUpdateTargetById con "!" para sacar un parámetro de una regla
# en TODAS las rutas de la aplicación).
# ==============================================================================

# ------------------------------------------------------------------------------
# 4. EXCLUSIÓN ACTIVA TIPO 3 · Cookie de sesión JWT excluida de la regla 942440
# ------------------------------------------------------------------------------
# La firma Base64URL dentro de la cookie "session" viaja en todas las rutas de
# la API (/api/tickets, /api/users, /api/dashboard) y puede contener secuencias
# que disparen la regla 942440 (SQL Comment Sequence Detected).
# • Con SecRuleUpdateTargetById se excluye ÚNICAMENTE !REQUEST_COOKIES:session
#   de la regla 942440 en todas las rutas, sin afectar ninguna detección de
#   los PoCs en el Dashboard de Kibana (942100, 941100, 911100).
# ------------------------------------------------------------------------------
SecRuleUpdateTargetById 942440 "!REQUEST_COOKIES:session"
