# ==============================================================================
# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
# Proyecto Final Integrador · Secure CRM — Equipo Azul (Hito 3)
# ==============================================================================
# Este archivo se carga en ModSecurity DESPUÉS de que ya se cargaron todas las
# reglas del OWASP CRS (911–949).
#
# Aquí se configuran las exclusiones de TIPO 3 (en tiempo de configuración,
# usando SecRuleUpdateTargetById con "!" para sacar un parámetro de una regla
# en TODAS las rutas de la aplicación).
# ==============================================================================

# ------------------------------------------------------------------------------
# TIPO 3 (MUESTRA PARA DEMO) · Un campo excluido de una regla en TODAS las rutas
# ------------------------------------------------------------------------------
# • Cuándo se usa el Tipo 3: Cuando un mismo parámetro o cookie (por ejemplo,
#   la cookie de sesión JWT "REQUEST_COOKIES:session" cuya firma Base64URL puede
#   contener secuencias de caracteres que disparen una regla de SQLi como 942440
#   o 942100) viaja en TODAS las rutas de la API (/api/tickets, /api/users,
#   /api/dashboard).
# • Cómo funciona: La directiva SecRuleUpdateTargetById modifica la regla del
#   CRS ya cargada en memoria y con el signo "!" retira únicamente ese parámetro
#   (!REQUEST_COOKIES:session) sin apagar la regla para los demás parámetros.
# • Nota: Se mantiene comentada para no ocultar alertas en el Dashboard de
#   Kibana salvo que se demuestre su activación:
# ------------------------------------------------------------------------------
# SecRuleUpdateTargetById 942100 "!REQUEST_COOKIES:session"
# SecRuleUpdateTargetById 942100 "!ARGS:json.description"
