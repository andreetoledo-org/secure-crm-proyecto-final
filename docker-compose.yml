# Levanta Secure CRM como si fuera un servidor real:
#   docker compose up --build
#   Web  -> http://localhost:3000
#   API  -> http://localhost:4000
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      API_PORT: "4000"
      # Hito 4: sin secreto fijo en el repo. Defínanlo en .env (>= 32 caracteres);
      # si falta, la API genera uno aleatorio en cada arranque.
      JWT_SECRET: "${JWT_SECRET:-}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # El navegador llama a la API por el puerto publicado en el host (o al WAF :8080 si se define en .env).
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
